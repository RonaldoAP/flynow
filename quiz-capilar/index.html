<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Divessence | Quiz capilar</title>
  <link rel="stylesheet" href="/quiz-capilar/quiz.css">
  <script src="/quiz-capilar/quiz.js" defer></script>
</head>
<body>
  <header class="quiz-header">
    <div class="header-inner">
      <img class="logo" src="/quiz-capilar/img/logo-divessence.svg" alt="Divessence">
      <div class="progress" role="progressbar" aria-label="Progresso do quiz" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
  </header>
  <main class="quiz" aria-labelledby="question">
    <h1 id="question">Você é homem ou mulher?</h1>
    <div class="choices">
      <a class="choice" data-quiz="m" href="https://www.divessencebeauty.com.br/quiz-m">
        <div class="portrait"><img src="/quiz-capilar/img/homem.webp" width="480" height="480" alt=""></div>
        <span>Homem</span>
      </a>
      <a class="choice" data-quiz="f" href="https://www.divessencebeauty.com.br/quiz-f">
        <div class="portrait"><img src="/quiz-capilar/img/mulher.webp" width="480" height="480" alt=""></div>
        <span>Mulher</span>
      </a>
    </div>
  </main>
</body>
</html>
